name: Deploy WoolyHome Theme

on:
  push:
    branches:
      - main
    paths:
      - "woolyhome-b2b/**"
      - ".github/workflows/deploy-theme.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without uploading files"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: deploy-woolyhome-b2b-theme
  cancel-in-progress: true

jobs:
  deploy-theme:
    name: Upload theme by FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate theme folder
        run: |
          test -f woolyhome-b2b/style.css
          test -f woolyhome-b2b/functions.php
          test -f woolyhome-b2b/front-page.php

      - name: Deploy woolyhome-b2b theme
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT }}
          protocol: ${{ secrets.HOSTINGER_FTP_PROTOCOL || 'ftp' }}
          security: loose
          timeout: 120000
          log-level: verbose
          local-dir: ./woolyhome-b2b/
          server-dir: ${{ secrets.HOSTINGER_FTP_TARGET_DIR }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
